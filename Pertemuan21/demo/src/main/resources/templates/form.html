<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Form Mahasiswa</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-success text-white">
          <h3>Form Mahasiswa</h3>
        </div>

        <div class="card-body">
          <form th:action="@{/simpan}" th:object="${mhs}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label>NIM</label>

              <input
                type="text"
                class="form-control"
                th:field="*{nim}"
                required
              />
            </div>

            <div class="mb-3">
              <label>Nama</label>

              <input
                type="text"
                class="form-control"
                th:field="*{nama}"
                required
              />
            </div>

            <div class="mb-3">
              <label>Jurusan</label>

              <input
                type="text"
                class="form-control"
                th:field="*{jurusan}"
                required
              />
            </div>

            <button class="btn btn-primary">Simpan</button>

            <a href="/" class="btn btn-secondary"> Kembali </a>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
