# ================================
# Konfigurasi Aplikasi Reservasi Delima
# ================================

# Nama aplikasi
spring.application.name=reservasi-delima

# Port web (default 8080), akses lewat http://localhost:8080/
server.port=8080

# ================================
# Konfigurasi Koneksi Database MySQL (JDBC)
# ================================
# Sesuaikan "root" dan password kosong ("") dengan konfigurasi MySQL di komputer Anda.
# Pastikan sudah membuat database dengan perintah:
#   CREATE DATABASE db_reservasi_delima;

spring.datasource.url=jdbc:mysql://localhost:3306/db_reservasi_delima?useSSL=false&serverTimezone=Asia/Jakarta&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# Konfigurasi JPA / Hibernate
# ================================
# ddl-auto=update -> tabel "reservasi" akan dibuat/diupdate otomatis
# sesuai class Entity Reservasi.java saat aplikasi pertama kali dijalankan.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================================
# Konfigurasi Thymeleaf
# ================================
# cache=false supaya perubahan file .html di templates langsung
# terlihat tanpa perlu restart aplikasi (memudahkan saat development)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
